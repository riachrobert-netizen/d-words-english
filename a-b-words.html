function speak(text,slow){if(!state.sound)return toast('Sound is off. Turn it on to listen.');if(!window.speechSynthesis)return toast('English audio is not supported here.');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const voices=speechSynthesis.getVoices();const voice=voices.find(v=>v.lang==='en-GB')||voices.find(v=>v.lang.startsWith('en'));if(voice)u.voice=voice;u.lang=voice?.lang||'en-GB';u.rate=slow?.65:.9;u.onerror=e=>{if(!['canceled','interrupted'].includes(e.error))toast('Audio is unavailable. Check your device’s English voice.');};speechSynthesis.speak(u);}
function audio(text){return `<div class="audio"><button data-say="${esc(text)}">▶ Listen</button><button data-say="${esc(text)}" data-slow="1">▶ Slowly</button></div>`;}
function ready(){const q=question(),s=session();return q.type==='tiles'||q.type==='spell'?s.tiles.length===s.pool.length:q.type==='match'?s.matched.length===q.pairs.length:s.selected!==null;}
function evaluate(){const q=question(),s=session();if(q.type==='match')return s.pairErrors===0;if(q.type==='tiles')return [q.answer,...(q.alternatives||[])].some(a=>norm(a)===norm(s.tiles.map(i=>s.pool[i]).join(' ')));if(q.type==='spell')return s.tiles.map(i=>s.pool[i]).join('').toLowerCase()===q.answer.toLowerCase();return s.selected===q.answer;}
function check(){const s=session();if(s.checked){if(s.pos===s.queue.length-1)s.done=true;else{s.pos++;s.current=null;}pairPick=null;window.speechSynthesis?.cancel();save();render();$('#heading')?.focus();return;}if(!ready())return;s.ok=evaluate();s.checked=true;if(!s.review)s.results[question().id]=s.ok;else if(!s.ok)s.reviewWrong.push(question().id);beep(s.ok);save();render();$('#feedback')?.focus();}
function switchRound(r){window.speechSynthesis?.cancel();state.round=r;pairPick=null;save();render();}
function review(){const s=session();const ids=s.review?s.reviewWrong:Object.keys(s.results).filter(id=>!s.results[id]);if(!ids.length)return;Object.assign(s,{queue:shuffle(ids),review:true,reviewWrong:[],pos:0,done:false,current:null});save();render();}
function restart(){if(!confirm('Restart this round? Its score will be reset.'))return;delete state.sessions[state.round];pairPick=null;save();render();}
function match(side,i){const s=session();if(s.checked||s.matched.includes(i))return;if(!pairPick||pairPick.side===side){pairPick=pairPick?.i===i&&pairPick.side===side?null:{side,i};render();return;}if(pairPick.i===i){s.matched.push(i);beep(true);}else{s.pairErrors++;beep(false);toast('Try again — those words have different meanings. 再试一次。');}pairPick=null;save();render();}
function render(){const s=session();$('#sound').textContent=`Sound: ${state.sound?'on':'off'}`;$('#sound').setAttribute('aria-pressed',state.sound);$('#rounds').innerHTML=ROUNDS.map((r,i)=>`<button class="roundbtn ${i===state.round?'active':''}" data-round="${i}" aria-current="${i===state.round?'step':'false'}"><strong>${state.sessions[i]?.done?'✓ ':''}Round ${i+1}</strong><small>${r.words[0][0]} → ${r.words[r.words.length-1][0]}</small></button>`).join('');document.querySelectorAll('[data-round]').forEach(b=>b.onclick=()=>switchRound(+b.dataset.round));if(s.done)return summary();prepare();const q=question();const titles={tiles:'Build the sentence',spell:'Spell the word',blank:'Fill in the blank',match:'Match the pairs',choice:'Choose the meaning',chat:'Complete the conversation'};const hints={tiles:'Tap every word in order. Tap a chosen word to return it. 按顺序排列单词。',spell:'Tap the scrambled letters to spell the English word. 按顺序点击字母，拼出英文单词。 缩写词也要加上撇号（’）。',blank:'Use the Chinese sentence to choose the missing English word. 选择正确的单词。',match:'Match an English word with its Chinese meaning. 配对英文和中文。',choice:`What does “${q.word}” mean in this sentence? 选择它在句中的意思。`,chat:'Choose the reply that makes sense. 选择合适的回答。'};let body='';
if(q.type==='tiles'||q.type==='spell'){const spelling=q.type==='spell';body=`<div class="prompt chinese">${spelling?esc(q.meaning):esc(q.translation)}</div><div class="answer" aria-label="${spelling?'Your word':'Your sentence'}">${s.tiles.length?s.tiles.map(i=>`<button class="tile" data-remove="${i}" ${s.checked?'disabled':''}>${esc(s.pool[i])}</button>`).join(''):`<span class="placeholder">${spelling?'Spell the English word here…':'Build your English sentence here…'}</span>`}</div><div class="pool">${s.pool.map((t,i)=>`<button class="tile ${s.tiles.includes(i)?'used':''}" data-tile="${i}" ${s.checked||s.tiles.includes(i)?'disabled':''}>${esc(t)}</button>`).join('')}</div>`;}
else if(q.type==='match'){body=`<div class="matching">${['left','right'].map(side=>`<div class="column">${(side==='left'?q.pairs.map((_,i)=>i):s.right).map(i=>`<button class="option ${s.matched.includes(i)?'matched':''} ${pairPick?.side===side&&pairPick.i===i?'selected':''}" data-side="${side}" data-pair="${i}" ${s.checked||s.matched.includes(i)?'disabled':''}>${esc(q.pairs[i][side==='left'?0:1])}${s.matched.includes(i)?' ✓':''}</button>`).join('')}</div>`).join('')}</div>`;}
else{let p=q.type==='blank'?q.sentence.replace(q.answer,'______'):q.type==='chat'?q.prompt:q.sentence;body=`<div class="prompt">${esc(p)}${q.type==='blank'?`<div class="translation chinese">${esc(q.translation)}</div>`:audio(p)}</div><div class="options">${s.options.map((v,i)=>`<button class="option ${s.checked?(v===q.answer?'right':v===s.selected?'wrong':''):v===s.selected?'selected':''}" data-choice="${i}" aria-pressed="${v===s.selected}" ${s.checked?'disabled':''}><span class="n">${i+1}</span>${esc(v)}</button>`).join('')}</div>`;}
const solution=q.type==='tiles'||q.type==='blank'?q.sentence:q.answer;const feedback=s.checked?`<div id="feedback" tabindex="-1" role="status" class="feedback ${s.ok?'':'bad'}"><strong>${s.ok?'✓ Well done! 答对了！':q.type==='match'?'All matched — keep practising!':'Let’s learn this one. 再学一下。'}</strong>${solution?`<p>${esc(solution)}</p>`:''}<p>${esc(q.note)}</p>${q.translation?`<p class="chinese">${esc(q.translation)}</p>`:''}${solution?audio(q.type==='choice'?q.sentence:solution):''}</div>`:'';
$('#app').innerHTML=`<div class="meta"><span>${s.review?'Mistake review · 错题复习':'Round '+(state.round+1)+' · '+ROUNDS[state.round].words.length+' words'}</span><span>${s.pos+1} / ${s.queue.length}</span></div><div class="bar" role="progressbar" aria-label="Round progress" aria-valuemin="0" aria-valuemax="${s.queue.length}" aria-valuenow="${s.pos+(s.checked?1:0)}"><div class="fill" style="width:${(s.pos+(s.checked?1:0))/s.queue.length*100}%"></div></div><div class="tag">A + B Word Club · ${q.type==='tiles'?'Sentence builder':'English practice'}</div><h1 id="heading" tabindex="-1">${titles[q.type]}</h1><p class="hint">${hints[q.type]}</p>${body}${feedback}<div class="actions"><span class="saved">Take your time.<br>慢慢来。</span><button class="primary" id="check" ${!s.checked&&!ready()?'disabled':''}>${s.checked?(s.pos===s.queue.length-1?'Finish round':'Continue →'):'Check answer'}</button></div>`;
$('#check').onclick=check;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{s.selected=s.options[+b.dataset.choice];save();render();});document.querySelectorAll('[data-tile]').forEach(b=>b.onclick=()=>{s.tiles.push(+b.dataset.tile);save();render();});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{s.tiles=s.tiles.filter(i=>i!==+b.dataset.remove);save();render();});document.querySelectorAll('[data-side]').forEach(b=>b.onclick=()=>match(b.dataset.side,+b.dataset.pair));document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say,!!b.dataset.slow));}
function summary(){const s=session(),good=Object.values(s.results).filter(Boolean).length,wrong=s.review?s.reviewWrong:Object.keys(s.results).filter(id=>!s.results[id]),total=ROUNDS[state.round].questions.length;$('#app').innerHTML=`<div class="summary"><div class="celebrate">★</div><div class="tag">${s.review?'Review complete':'Round complete'}</div><h1 id="heading" tabindex="-1">Nice work! 做得好！</h1><p>You practised ${ROUNDS[state.round].words.map(w=>esc(w[0])).join(', ')}.</p><div class="stats"><div class="stat"><strong>${good} / ${total}</strong>First try</div><div class="stat"><strong>${good*10}</strong>Points</div></div><p class="hint">Matching questions earn a point when all pairs are correct without a mismatch.<br>配对题需要一次全部配对正确才能得分。</p><div class="actions">${wrong.length?`<button class="primary" id="review">Review ${wrong.length} mistakes</button>`:''}${state.round<3?'<button class="primary" id="nextRound">Next round →</button>':'<button class="primary" id="firstRound">Back to Round 1</button>'}<button class="quiet" id="again">Repeat round</button></div></div>`;if($('#review'))$('#review').onclick=review;if($('#nextRound'))$('#nextRound').onclick=()=>switchRound(state.round+1);if($('#firstRound'))$('#firstRound').onclick=()=>switchRound(0);$('#again').onclick=restart;}
$('#sound').onclick=()=>{state.sound=!state.sound;if(!state.sound)window.speechSynthesis?.cancel();save();render();};$('#reset').onclick=restart;document.addEventListener('keydown',e=>{if(e.isComposing||session().done)return;if(e.key==='Enter'&&e.target.tagName!=='BUTTON'){e.preventDefault();if(session().checked||ready())check();}else if(!session().checked&&/^[1-3]$/.test(e.key))document.querySelector(`[data-choice="${+e.key-1}"]`)?.click();});render();
</script></body></html>
